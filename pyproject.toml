[project]
name = "taxifare"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Maximilian Greger", email = "max.greger95@gmx.de" }
]
requires-python = ">=3.12.9"
dependencies = [
    "fastapi>=0.142.4",
    "pandas<3",
    "uvicorn>=0.54.0",
]

[project.scripts]
taxifare = "taxifare:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
